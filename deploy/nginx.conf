server {
    listen 8080;
    server_name meiot.site;

    root /usr/share/nginx/html;
    index index.html;

    # Basic hardening
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Cache hashed static assets aggressively (Parcel adds content hashes)
    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|svg|ico|woff2?|ttf|otf|mp3|mp4)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Alias: /birthday.html -> the parcel-generated index.html
    location = /birthday.html {
        try_files /index.html =404;
    }

    # Every other .html page (sleep, nup, fiting, christmas, newyear, valentine,
    # halloween, miss, women, game) is served as-is from dist root.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Fallback: root serves the birthday page
    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
