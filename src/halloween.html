<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a0a1e" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Halloween · coming soon</title>
    <meta name="description" content="Something spooky-cute is brewing. Come back Oct 31." />

    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Fraunces:opsz,wght@9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="apple-touch-icon" sizes="180x180" href="./resources/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="./resources/favicon/site.webmanifest" />

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --bg1: #0e0518; --bg2: #1a0a1e; --bg3: #2a1533;
        --orange: #ff8a3d; --orange-2: #ffb072; --purple: #a866ff;
        --cream: #fff2ea; --text: #fff2ea; --text-dim: #c9a8b8;
      }
      html, body { min-height: 100dvh; overflow-x: hidden; }
      body {
        font-family: "Inter", system-ui, sans-serif; color: var(--text);
        background:
          radial-gradient(700px 400px at 90% 10%, rgba(168,102,255,0.18), transparent),
          radial-gradient(600px 400px at 10% 90%, rgba(255,138,61,0.12), transparent),
          linear-gradient(180deg, var(--bg1), var(--bg2), var(--bg3));
        min-height: 100dvh;
        -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
        padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
        display: flex; align-items: center; justify-content: center;
        position: relative;
      }
      .fx {
        position: fixed; inset: 0;
        pointer-events: none; z-index: 1;
      }
      .fx-item {
        position: absolute;
        font-size: 1.6rem;
        opacity: 0.2;
        animation: float 12s ease-in-out infinite;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0) translateX(0); }
        25% { transform: translateY(-30px) translateX(20px); }
        50% { transform: translateY(-20px) translateX(-20px); }
        75% { transform: translateY(-40px) translateX(10px); }
      }

      .card {
        max-width: 480px; width: 100%; text-align: center;
        position: relative; z-index: 2;
        padding: 32px 24px 40px;
      }
      .back {
        position: absolute; top: 20px; left: 20px;
        display: inline-flex; align-items: center; gap: 6px;
        color: var(--text-dim); text-decoration: none; font-size: 0.9rem;
        padding: 8px 12px; border-radius: 999px;
        background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
        min-height: 40px; z-index: 3;
      }

      .pumpkin {
        width: 140px; height: 140px; margin: 0 auto 20px;
        animation: wobble 3s ease-in-out infinite;
        filter: drop-shadow(0 8px 24px rgba(255,138,61,0.4));
      }
      @keyframes wobble {
        0%, 100% { transform: rotate(-2deg); }
        50% { transform: rotate(2deg); }
      }
      .pumpkin svg { width: 100%; height: 100%; }
      .pumpkin .glow { animation: glowPulse 2s ease-in-out infinite; }
      @keyframes glowPulse {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }

      .eyebrow {
        font-size: 0.72rem; letter-spacing: 0.4em; text-transform: uppercase;
        color: var(--orange); margin-bottom: 10px;
      }
      h1 {
        font-family: "Creepster", cursive;
        font-size: clamp(2.2rem, 9vw, 3rem);
        color: var(--orange); letter-spacing: 0.03em;
        text-shadow: 0 0 24px rgba(255,138,61,0.4);
        margin-bottom: 8px;
      }
      .lead {
        color: var(--text-dim); font-size: 0.95rem;
        margin-bottom: 22px; line-height: 1.5;
      }
      .countdown {
        display: grid; grid-template-columns: repeat(4, 1fr);
        gap: 8px; margin-bottom: 22px;
      }
      .cd {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(168,102,255,0.2);
        border-radius: 14px; padding: 12px 4px;
        backdrop-filter: blur(8px);
      }
      .cd-num { font-family: "Fraunces", serif; font-size: clamp(1.4rem, 5.5vw, 1.9rem); color: var(--orange-2); }
      .cd-lbl { font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-dim); margin-top: 6px; }

      .note {
        font-family: "Fraunces", serif; font-style: italic;
        color: var(--cream); font-size: 1rem; line-height: 1.6;
        max-width: 32ch; margin: 0 auto;
      }
      footer { margin-top: 24px; color: var(--text-dim); font-size: 0.8rem; }
    </style>
  </head>
  <body>
    <div class="fx" aria-hidden="true">
      <div class="fx-item" style="top: 15%; left: 5%; animation-delay: 0s;">👻</div>
      <div class="fx-item" style="top: 40%; right: 8%; animation-delay: 2s;">🦇</div>
      <div class="fx-item" style="top: 65%; left: 10%; animation-delay: 4s;">🕸</div>
      <div class="fx-item" style="top: 85%; right: 15%; animation-delay: 1s;">👻</div>
      <div class="fx-item" style="top: 25%; right: 30%; animation-delay: 6s;">🦇</div>
      <div class="fx-item" style="top: 55%; left: 30%; animation-delay: 3s;">🕷</div>
    </div>

    <a href="/" class="back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      home
    </a>

    <main class="card">
      <div class="pumpkin" aria-hidden="true">
        <svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="pglow">
              <stop offset="0%" stop-color="#ffcc66" stop-opacity="0.9"/>
              <stop offset="100%" stop-color="#ff8a3d" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <circle class="glow" cx="70" cy="75" r="70" fill="url(#pglow)"/>
          <rect x="65" y="15" width="10" height="18" rx="2" fill="#4a7a2a"/>
          <path d="M65 20 Q52 18 48 8" stroke="#6bcf7f" stroke-width="3" fill="none" stroke-linecap="round"/>
          <ellipse cx="70" cy="80" rx="55" ry="48" fill="#ff8a3d"/>
          <ellipse cx="70" cy="80" rx="40" ry="48" fill="#ff7a2d" opacity="0.5"/>
          <ellipse cx="70" cy="80" rx="22" ry="48" fill="#ff6d1c" opacity="0.4"/>
          <!-- eyes -->
          <polygon points="45,68 58,58 68,72 58,76" fill="#0a0410"/>
          <polygon points="95,68 82,58 72,72 82,76" fill="#0a0410"/>
          <!-- nose -->
          <polygon points="70,80 63,90 77,90" fill="#0a0410"/>
          <!-- mouth -->
          <path d="M43 100 Q70 130 97 100 L88 105 L80 100 L72 105 L64 100 L56 105 L48 100 Z" fill="#0a0410"/>
        </svg>
      </div>

      <div class="eyebrow">something is brewing</div>
      <h1>Halloween Soon</h1>
      <p class="lead">Cute-spooky is still being carved. Come back Oct 31 for the trick... or the treat.</p>

      <div class="countdown">
        <div class="cd"><div class="cd-num" id="d">--</div><div class="cd-lbl">days</div></div>
        <div class="cd"><div class="cd-num" id="h">--</div><div class="cd-lbl">hrs</div></div>
        <div class="cd"><div class="cd-num" id="m">--</div><div class="cd-lbl">min</div></div>
        <div class="cd"><div class="cd-num" id="s">--</div><div class="cd-lbl">sec</div></div>
      </div>

      <p class="note">"You'll always be my treat, never a trick." ♡</p>
      <footer>meiot.site · check back on Oct 31</footer>
    </main>

    <script type="module">
      function nextTarget() {
        const now = new Date();
        let t = new Date(now.getFullYear(), 9, 31);
        if (t < now) t = new Date(now.getFullYear() + 1, 9, 31);
        return t;
      }
      const target = nextTarget();
      function tick() {
        const diff = target - new Date();
        if (diff <= 0) { ["d","h","m","s"].forEach(id => document.getElementById(id).textContent = 0); return; }
        document.getElementById("d").textContent = Math.floor(diff / 864e5);
        document.getElementById("h").textContent = String(Math.floor(diff / 36e5) % 24).padStart(2,"0");
        document.getElementById("m").textContent = String(Math.floor(diff / 6e4) % 60).padStart(2,"0");
        document.getElementById("s").textContent = String(Math.floor(diff / 1000) % 60).padStart(2,"0");
      }
      tick(); setInterval(tick, 1000);
    </script>
  </body>
</html>
