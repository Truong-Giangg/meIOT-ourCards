<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fce8ea" />
    <title>Women's Day · coming soon</title>
    <meta name="description" content="Bouquet still blooming. Come back March 8." />

    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,ital,wght@9..144,0,300;9..144,1,300;9..144,0,500&family=Quicksand:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="apple-touch-icon" sizes="180x180" href="./resources/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="./resources/favicon/site.webmanifest" />

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --bg1: #fdf5f6; --bg2: #fce8ea; --bg3: #f8d6dc;
        --rose: #d67285; --rose-2: #e88fa0; --pink: #f5b4c0;
        --gold: #d4a24c; --leaf: #7a9e6e;
        --ink: #4a2836; --ink-dim: #8a6772; --cream: #fff8f0;
      }
      html, body { min-height: 100dvh; overflow-x: hidden; }
      body {
        font-family: "Quicksand", system-ui, sans-serif; color: var(--ink);
        background:
          radial-gradient(700px 500px at 90% 5%, rgba(214,114,133,0.15), transparent),
          radial-gradient(600px 500px at 10% 100%, rgba(212,162,76,0.10), transparent),
          linear-gradient(180deg, var(--bg1), var(--bg2), var(--bg3));
        min-height: 100dvh;
        -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
        padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
        display: flex; align-items: center; justify-content: center;
        position: relative;
      }
      .fx-petals { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
      .petal {
        position: absolute; top: -20px;
        font-size: 1rem; opacity: 0.5;
        animation: fall linear infinite;
      }
      @keyframes fall { to { transform: translate(30px, calc(100vh + 40px)) rotate(360deg); } }

      .card {
        max-width: 480px; width: 100%; text-align: center;
        position: relative; z-index: 2;
        padding: 32px 24px 40px;
        background: rgba(255,255,255,0.6);
        border: 1px solid rgba(214,114,133,0.15);
        border-radius: 28px;
        box-shadow: 0 12px 40px rgba(214,114,133,0.12);
        backdrop-filter: blur(10px);
      }
      .back {
        position: absolute; top: 20px; left: 20px;
        display: inline-flex; align-items: center; gap: 6px;
        color: var(--ink-dim); text-decoration: none; font-size: 0.9rem;
        padding: 8px 12px; border-radius: 999px;
        background: rgba(255,255,255,0.8); border: 1px solid rgba(214,114,133,0.2);
        min-height: 40px; z-index: 3;
      }

      .flower {
        width: 130px; height: 130px; margin: 0 auto 16px;
        animation: sway 4s ease-in-out infinite;
      }
      @keyframes sway {
        0%, 100% { transform: rotate(-3deg); }
        50% { transform: rotate(3deg); }
      }
      .flower svg { width: 100%; height: 100%; filter: drop-shadow(0 6px 16px rgba(214,114,133,0.25)); }
      .flower .bloom {
        transform-origin: center;
        transform-box: fill-box;
        animation: bloomIn 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      @keyframes bloomIn {
        from { transform: scale(0); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }

      .date-badge {
        display: inline-block;
        background: rgba(255,255,255,0.8);
        border: 1px solid rgba(214,114,133,0.25);
        color: var(--rose);
        padding: 4px 14px; border-radius: 999px;
        font-size: 0.72rem; letter-spacing: 0.3em;
        text-transform: uppercase;
        margin-bottom: 14px;
      }
      h1 {
        font-family: "Fraunces", serif;
        font-size: clamp(1.8rem, 7vw, 2.4rem); font-weight: 400;
        line-height: 1.2;
        margin-bottom: 8px;
      }
      h1 em { color: var(--rose); font-style: italic; }
      .lead {
        color: var(--ink-dim); font-size: 0.95rem;
        margin-bottom: 22px; line-height: 1.5;
      }
      .countdown {
        display: grid; grid-template-columns: repeat(4, 1fr);
        gap: 8px; margin-bottom: 22px;
      }
      .cd {
        background: rgba(255,255,255,0.7);
        border: 1px solid rgba(214,114,133,0.15);
        border-radius: 14px; padding: 12px 4px;
      }
      .cd-num { font-family: "Fraunces", serif; font-size: clamp(1.4rem, 5.5vw, 1.9rem); color: var(--rose); }
      .cd-lbl { font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ink-dim); margin-top: 6px; }

      .note {
        font-family: "Fraunces", serif; font-style: italic;
        color: var(--ink); font-size: 1rem; line-height: 1.6;
        max-width: 32ch; margin: 0 auto;
      }
      footer { margin-top: 20px; color: var(--ink-dim); font-size: 0.78rem; }
    </style>
  </head>
  <body>
    <div class="fx-petals" id="petals" aria-hidden="true"></div>

    <a href="./fiting.html" class="back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      home
    </a>

    <main class="card">
      <div class="flower" aria-hidden="true">
        <svg viewBox="0 0 130 130" xmlns="http://www.w3.org/2000/svg">
          <path d="M65 90 L65 125" stroke="#7a9e6e" stroke-width="3" fill="none" stroke-linecap="round"/>
          <ellipse cx="55" cy="105" rx="10" ry="6" fill="#7a9e6e" transform="rotate(-30 55 105)"/>
          <ellipse cx="75" cy="112" rx="10" ry="6" fill="#a3c497" transform="rotate(30 75 112)"/>
          <g class="bloom" style="animation-delay:0.1s">
            <ellipse cx="65" cy="45" rx="14" ry="22" fill="#e88fa0"/>
            <ellipse cx="47" cy="60" rx="14" ry="22" fill="#f5b4c0" transform="rotate(-60 47 60)"/>
            <ellipse cx="83" cy="60" rx="14" ry="22" fill="#d67285" transform="rotate(60 83 60)"/>
            <ellipse cx="45" cy="80" rx="14" ry="22" fill="#f5b4c0" transform="rotate(-120 45 80)"/>
            <ellipse cx="85" cy="80" rx="14" ry="22" fill="#e88fa0" transform="rotate(120 85 80)"/>
            <ellipse cx="65" cy="95" rx="14" ry="22" fill="#d67285" transform="rotate(180 65 95)"/>
            <circle cx="65" cy="70" r="10" fill="#d4a24c"/>
            <circle cx="65" cy="70" r="6" fill="#a07830"/>
          </g>
        </svg>
      </div>

      <div class="date-badge">March 8</div>
      <h1>For <em>her</em>, always</h1>
      <p class="lead">Still gathering the softest words. Come back on Women's Day for a bouquet made just for you.</p>

      <div class="countdown">
        <div class="cd"><div class="cd-num" id="d">--</div><div class="cd-lbl">days</div></div>
        <div class="cd"><div class="cd-num" id="h">--</div><div class="cd-lbl">hrs</div></div>
        <div class="cd"><div class="cd-num" id="m">--</div><div class="cd-lbl">min</div></div>
        <div class="cd"><div class="cd-num" id="s">--</div><div class="cd-lbl">sec</div></div>
      </div>

      <p class="note">"Every day the world is better because you're in it." ♡</p>
      <footer>meiot.site · check back on March 8</footer>
    </main>

    <script type="module">
      function nextTarget() {
        const now = new Date();
        let t = new Date(now.getFullYear(), 2, 8);
        if (t < now) t = new Date(now.getFullYear() + 1, 2, 8);
        return t;
      }
      const target = nextTarget();
      function tick() {
        const diff = target - new Date();
        if (diff <= 0) { ["d","h","m","s"].forEach(id => document.getElementById(id).textContent = 0); return; }
        document.getElementById("d").textContent = Math.floor(diff / 864e5);
        document.getElementById("h").textContent = String(Math.floor(diff / 36e5) % 24).padStart(2,"0");
        document.getElementById("m").textContent = String(Math.floor(diff / 6e4) % 60).padStart(2,"0");
        document.getElementById("s").textContent = String(Math.floor(diff / 1000) % 60).padStart(2,"0");
      }
      tick(); setInterval(tick, 1000);

      // Falling petals
      const container = document.getElementById("petals");
      const emojis = ["🌸", "🌺", "🌷", "🌹", "🌼", "💮"];
      for (let i = 0; i < 12; i++) {
        const p = document.createElement("div");
        p.className = "petal";
        p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        p.style.left = Math.random() * 100 + "%";
        p.style.animationDuration = (10 + Math.random() * 12) + "s";
        p.style.animationDelay = -Math.random() * 12 + "s";
        p.style.fontSize = (0.7 + Math.random() * 0.7) + "rem";
        container.appendChild(p);
      }
    </script>
  </body>
</html>
