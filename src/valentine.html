<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2a0a1a" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Valentine's · coming soon</title>
    <meta name="description" content="Getting a hundred hearts ready. Come back Feb 14." />

    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,ital,wght@9..144,0,300;9..144,1,300;9..144,0,500&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="apple-touch-icon" sizes="180x180" href="./resources/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="./resources/favicon/site.webmanifest" />

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --bg1: #1a0510; --bg2: #2a0a1a; --bg3: #3d1128;
        --rose: #ff8ba3; --rose-dark: #d55e7a; --pink: #ffb8c8; --gold: #f4c14b;
        --cream: #fff2ea; --text: #fff2ea; --text-dim: #d6a8b8;
      }
      html, body { min-height: 100dvh; overflow-x: hidden; }
      body {
        font-family: "Inter", system-ui, sans-serif; color: var(--text);
        background:
          radial-gradient(700px 400px at 90% 0%, rgba(255,139,163,0.18), transparent),
          linear-gradient(180deg, var(--bg1), var(--bg2), var(--bg3));
        min-height: 100dvh;
        -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
        padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
        display: flex; align-items: center; justify-content: center;
        position: relative;
      }
      #fx { position: fixed; inset: 0; pointer-events: none; z-index: 1; }

      .card {
        max-width: 480px; width: 100%; text-align: center;
        position: relative; z-index: 2;
        padding: 32px 24px 40px;
      }
      .back {
        position: absolute; top: 20px; left: 20px;
        display: inline-flex; align-items: center; gap: 6px;
        color: var(--text-dim); text-decoration: none; font-size: 0.9rem;
        padding: 8px 12px; border-radius: 999px;
        background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
        min-height: 40px; z-index: 3;
      }

      .heart-big {
        width: 100px; height: 100px; margin: 0 auto 20px;
        animation: beat 1.4s ease-in-out infinite;
        filter: drop-shadow(0 0 24px rgba(255,139,163,0.5));
      }
      @keyframes beat {
        0%, 100% { transform: scale(1); }
        20%, 60% { transform: scale(1.15); }
      }
      .heart-big svg { width: 100%; height: 100%; }

      .eyebrow {
        font-size: 0.72rem; letter-spacing: 0.4em; text-transform: uppercase;
        color: var(--rose); margin-bottom: 10px;
      }
      h1 {
        font-family: "Fraunces", serif;
        font-size: clamp(2rem, 8vw, 2.8rem); font-weight: 400;
        margin-bottom: 8px;
      }
      h1 em {
        font-style: italic;
        background: linear-gradient(135deg, var(--rose), var(--pink), var(--gold));
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .lead {
        color: var(--text-dim); font-size: 0.95rem;
        margin-bottom: 22px; line-height: 1.5;
      }
      .countdown {
        display: grid; grid-template-columns: repeat(4, 1fr);
        gap: 8px; margin-bottom: 22px;
      }
      .cd {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,139,163,0.2);
        border-radius: 14px; padding: 12px 4px;
        backdrop-filter: blur(8px);
      }
      .cd-num { font-family: "Fraunces", serif; font-size: clamp(1.4rem, 5.5vw, 1.9rem); color: var(--pink); }
      .cd-lbl { font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-dim); margin-top: 6px; }

      .note {
        font-family: "Fraunces", serif; font-style: italic;
        color: var(--cream); font-size: 1rem; line-height: 1.6;
        max-width: 32ch; margin: 0 auto;
      }
      footer { margin-top: 24px; color: var(--text-dim); font-size: 0.8rem; }
    </style>
  </head>
  <body>
    <canvas id="fx"></canvas>
    <a href="/" class="back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      home
    </a>

    <main class="card">
      <div class="heart-big" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="url(#g)" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ff8ba3"/>
              <stop offset="100%" stop-color="#d55e7a"/>
            </linearGradient>
          </defs>
          <path d="M12 21s-7-5.5-9-10a5 5 0 019-3 5 5 0 019 3c-2 4.5-9 10-9 10z"/>
        </svg>
      </div>

      <div class="eyebrow">warming up for</div>
      <h1><em>Valentine's</em> Day</h1>
      <p class="lead">A hundred reasons are still being written. Come back on Feb 14 and I'll have them ready for you.</p>

      <div class="countdown">
        <div class="cd"><div class="cd-num" id="d">--</div><div class="cd-lbl">days</div></div>
        <div class="cd"><div class="cd-num" id="h">--</div><div class="cd-lbl">hrs</div></div>
        <div class="cd"><div class="cd-num" id="m">--</div><div class="cd-lbl">min</div></div>
        <div class="cd"><div class="cd-num" id="s">--</div><div class="cd-lbl">sec</div></div>
      </div>

      <p class="note">"You are my everyday, not just my Valentine." ♡</p>
      <footer>meiot.site · check back on Feb 14</footer>
    </main>

    <script type="module">
      function nextTarget() {
        const now = new Date();
        let t = new Date(now.getFullYear(), 1, 14);
        if (t < now) t = new Date(now.getFullYear() + 1, 1, 14);
        return t;
      }
      const target = nextTarget();
      function tick() {
        const diff = target - new Date();
        if (diff <= 0) { ["d","h","m","s"].forEach(id => document.getElementById(id).textContent = 0); return; }
        document.getElementById("d").textContent = Math.floor(diff / 864e5);
        document.getElementById("h").textContent = String(Math.floor(diff / 36e5) % 24).padStart(2,"0");
        document.getElementById("m").textContent = String(Math.floor(diff / 6e4) % 60).padStart(2,"0");
        document.getElementById("s").textContent = String(Math.floor(diff / 1000) % 60).padStart(2,"0");
      }
      tick(); setInterval(tick, 1000);

      // Floating hearts
      const cvs = document.getElementById("fx"); const ctx = cvs.getContext("2d");
      let W, H, hearts = [];
      function resize() {
        W = window.innerWidth; H = window.innerHeight;
        cvs.width = W * devicePixelRatio; cvs.height = H * devicePixelRatio;
        cvs.style.width = W + "px"; cvs.style.height = H + "px";
        ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      }
      resize(); window.addEventListener("resize", resize);
      function drawHeart(x, y, s, color, alpha) {
        ctx.globalAlpha = alpha;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(x, y + s/4);
        ctx.bezierCurveTo(x, y, x-s/2, y, x-s/2, y+s/4);
        ctx.bezierCurveTo(x-s/2, y+s/1.7, x, y+s/1.3, x, y+s);
        ctx.bezierCurveTo(x, y+s/1.3, x+s/2, y+s/1.7, x+s/2, y+s/4);
        ctx.bezierCurveTo(x+s/2, y, x, y, x, y+s/4);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      setInterval(() => {
        if (hearts.length < 30) hearts.push({
          x: Math.random() * W, y: H + 20,
          vy: -0.5 - Math.random() * 0.8, vx: (Math.random() - 0.5) * 0.4,
          s: 6 + Math.random() * 10, life: 1,
          color: ["#ff8ba3", "#ffb8c8", "#f4c14b"][Math.floor(Math.random() * 3)],
        });
      }, 400);
      function frame() {
        ctx.clearRect(0, 0, W, H);
        for (let i = hearts.length - 1; i >= 0; i--) {
          const h = hearts[i];
          h.x += h.vx; h.y += h.vy; h.life -= 0.003;
          if (h.life <= 0 || h.y < -20) { hearts.splice(i, 1); continue; }
          drawHeart(h.x, h.y, h.s, h.color, Math.min(0.6, h.life));
        }
        requestAnimationFrame(frame);
      }
      frame();
    </script>
  </body>
</html>
