<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a1a" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>New Year · coming soon</title>
    <meta name="description" content="Fireworks warming up. Come back on the 31st." />

    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="apple-touch-icon" sizes="180x180" href="./resources/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="./resources/favicon/site.webmanifest" />

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --bg1: #05051a; --bg2: #0a0a25; --bg3: #1a0e3a;
        --gold: #f4c14b; --gold-2: #ffd97a; --pink: #ff8fa3; --purple: #a68bff;
        --text: #f4f0ff; --text-dim: #a89fc9;
      }
      html, body { min-height: 100dvh; overflow-x: hidden; }
      body {
        font-family: "Inter", system-ui, sans-serif; color: var(--text);
        background: linear-gradient(180deg, var(--bg1), var(--bg2) 50%, var(--bg3));
        min-height: 100dvh;
        -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
        padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
        display: flex; align-items: center; justify-content: center;
        position: relative;
      }
      #fx { position: fixed; inset: 0; pointer-events: none; z-index: 1; }

      .card {
        max-width: 480px; width: 100%; text-align: center;
        position: relative; z-index: 2;
        padding: 32px 24px 40px;
      }
      .back {
        position: absolute; top: 20px; left: 20px;
        display: inline-flex; align-items: center; gap: 6px;
        color: var(--text-dim); text-decoration: none; font-size: 0.9rem;
        padding: 8px 12px; border-radius: 999px;
        background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
        min-height: 40px; z-index: 3;
      }

      .eyebrow {
        font-size: 0.72rem; letter-spacing: 0.4em; text-transform: uppercase;
        color: var(--gold); margin-bottom: 12px;
      }
      .year {
        font-family: "Fraunces", serif;
        font-size: clamp(4rem, 20vw, 7rem); font-weight: 300;
        line-height: 1;
        background: linear-gradient(135deg, var(--gold), var(--pink), var(--purple));
        -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 0 40px rgba(244,193,75,0.3));
        margin-bottom: 6px;
        animation: shimmer 3s ease-in-out infinite;
      }
      @keyframes shimmer {
        0%, 100% { filter: drop-shadow(0 0 40px rgba(244,193,75,0.3)); }
        50% { filter: drop-shadow(0 0 60px rgba(255,143,163,0.5)); }
      }
      h1 {
        font-family: "Fraunces", serif;
        font-size: 1.1rem; font-weight: 400; font-style: italic;
        color: var(--gold-2); margin-bottom: 18px;
      }
      .countdown {
        display: grid; grid-template-columns: repeat(4, 1fr);
        gap: 8px; margin-bottom: 22px;
      }
      .cd {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 14px; padding: 12px 4px;
        backdrop-filter: blur(8px);
      }
      .cd-num { font-family: "Fraunces", serif; font-size: clamp(1.4rem, 5.5vw, 1.9rem); color: var(--gold-2); }
      .cd-lbl { font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-dim); margin-top: 6px; }

      .note {
        font-family: "Fraunces", serif; font-style: italic;
        color: var(--text); font-size: 1rem; line-height: 1.6;
        max-width: 32ch; margin: 0 auto;
      }
      footer { margin-top: 24px; color: var(--text-dim); font-size: 0.8rem; }
    </style>
  </head>
  <body>
    <canvas id="fx"></canvas>
    <a href="/fiting.html" class="back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      home
    </a>

    <main class="card">
      <div class="eyebrow">counting toward</div>
      <div class="year" id="yearNum">2027</div>
      <h1>a fresh page, together</h1>

      <div class="countdown">
        <div class="cd"><div class="cd-num" id="d">--</div><div class="cd-lbl">days</div></div>
        <div class="cd"><div class="cd-num" id="h">--</div><div class="cd-lbl">hrs</div></div>
        <div class="cd"><div class="cd-num" id="m">--</div><div class="cd-lbl">min</div></div>
        <div class="cd"><div class="cd-num" id="s">--</div><div class="cd-lbl">sec</div></div>
      </div>

      <p class="note">"Wherever midnight finds us, save one kiss for me." ♡</p>
      <footer>meiot.site · check back on Dec 31</footer>
    </main>

    <script type="module">
      // Target: next Jan 1
      function nextTarget() {
        const now = new Date();
        let t = new Date(now.getFullYear() + 1, 0, 1);
        if (now < new Date(now.getFullYear(), 0, 1)) t = new Date(now.getFullYear(), 0, 1);
        return t;
      }
      const target = nextTarget();
      document.getElementById("yearNum").textContent = target.getFullYear();
      function tick() {
        const diff = target - new Date();
        if (diff <= 0) { ["d","h","m","s"].forEach(id => document.getElementById(id).textContent = 0); return; }
        document.getElementById("d").textContent = Math.floor(diff / 864e5);
        document.getElementById("h").textContent = String(Math.floor(diff / 36e5) % 24).padStart(2,"0");
        document.getElementById("m").textContent = String(Math.floor(diff / 6e4) % 60).padStart(2,"0");
        document.getElementById("s").textContent = String(Math.floor(diff / 1000) % 60).padStart(2,"0");
      }
      tick(); setInterval(tick, 1000);

      // Ambient fireworks (slow, distant)
      const cvs = document.getElementById("fx"); const ctx = cvs.getContext("2d");
      let W, H;
      function resize() {
        W = window.innerWidth; H = window.innerHeight;
        cvs.width = W * devicePixelRatio; cvs.height = H * devicePixelRatio;
        cvs.style.width = W + "px"; cvs.style.height = H + "px";
        ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      }
      resize(); window.addEventListener("resize", resize);
      const particles = [];
      const colors = ["#f4c14b", "#ff8fa3", "#a68bff", "#7bc9e2", "#ffd97a"];
      function explode(x, y, color) {
        for (let i = 0; i < 40; i++) {
          const a = Math.PI * 2 * i / 40, sp = 1.5 + Math.random() * 2;
          particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, color, size: 2 });
        }
      }
      setInterval(() => {
        explode(W * (0.2 + Math.random() * 0.6), H * (0.2 + Math.random() * 0.3), colors[Math.floor(Math.random() * colors.length)]);
      }, 2500);
      function frame() {
        ctx.fillStyle = "rgba(5,5,26,0.15)"; ctx.fillRect(0, 0, W, H);
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life -= 0.012;
          if (p.life <= 0) { particles.splice(i, 1); continue; }
          ctx.beginPath(); ctx.globalAlpha = p.life;
          ctx.fillStyle = p.color;
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
          ctx.globalAlpha = 1;
        }
        requestAnimationFrame(frame);
      }
      frame();
    </script>
  </body>
</html>
