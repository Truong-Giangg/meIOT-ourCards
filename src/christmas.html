<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e2a2b" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Christmas · coming soon</title>
    <meta name="description" content="Warming up for Christmas. Come back closer to the day." />
    <meta property="og:title" content="Christmas · coming soon" />

    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="apple-touch-icon" sizes="180x180" href="./resources/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="./resources/favicon/site.webmanifest" />

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --bg1: #0a1f22; --bg2: #0e2a2b; --bg3: #1b3d3a;
        --pine: #3d8a6a; --gold: #f4c14b; --red: #d3423a;
        --cream: #f5efdf; --text: #f5efdf; --text-dim: #a8b8b0;
      }
      html, body { min-height: 100dvh; overflow-x: hidden; }
      body {
        font-family: "Inter", system-ui, sans-serif; color: var(--text);
        background:
          radial-gradient(1000px 500px at 90% 0%, rgba(244,193,75,0.10), transparent),
          linear-gradient(180deg, var(--bg1), var(--bg2) 50%, var(--bg3));
        min-height: 100dvh;
        -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
        padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
        display: flex; align-items: center; justify-content: center;
        position: relative;
      }
      #snow { position: fixed; inset: 0; pointer-events: none; z-index: 1; }

      .card {
        max-width: 480px; width: 100%; text-align: center;
        position: relative; z-index: 2;
        padding: 32px 24px 40px;
      }
      .back {
        position: absolute; top: 20px; left: 20px;
        display: inline-flex; align-items: center; gap: 6px;
        color: var(--text-dim); text-decoration: none; font-size: 0.9rem;
        padding: 8px 12px; border-radius: 999px;
        background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
        min-height: 40px; z-index: 3;
      }
      .tree {
        width: 140px; height: 180px; margin: 0 auto 20px;
        filter: drop-shadow(0 8px 24px rgba(0,0,0,0.4));
      }
      .tree svg { width: 100%; height: 100%; }
      .tree .star { animation: twinkle 2s ease-in-out infinite; transform-origin: 70px 20px; }
      @keyframes twinkle {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px var(--gold)); }
        50% { transform: scale(1.15); filter: drop-shadow(0 0 22px var(--gold)); }
      }
      .tree .bulb { animation: bulb 2s ease-in-out infinite; }
      .tree .bulb:nth-child(6n) { animation-delay: 0.3s; }
      .tree .bulb:nth-child(6n+1) { animation-delay: 0.6s; }
      .tree .bulb:nth-child(6n+2) { animation-delay: 0.9s; }
      .tree .bulb:nth-child(6n+3) { animation-delay: 1.2s; }
      .tree .bulb:nth-child(6n+4) { animation-delay: 1.5s; }
      @keyframes bulb {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; filter: drop-shadow(0 0 8px currentColor); }
      }

      .eyebrow {
        font-size: 0.72rem; letter-spacing: 0.4em; text-transform: uppercase;
        color: var(--gold); margin-bottom: 10px;
      }
      h1 {
        font-family: "Fraunces", serif;
        font-size: clamp(2rem, 8vw, 2.8rem); font-weight: 400;
        margin-bottom: 8px;
      }
      h1 em { font-style: italic; color: var(--gold); }
      .lead {
        color: var(--text-dim); font-size: 0.95rem;
        margin-bottom: 22px; line-height: 1.5;
      }
      .countdown {
        display: grid; grid-template-columns: repeat(4, 1fr);
        gap: 8px; margin-bottom: 22px;
      }
      .cd {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 14px; padding: 12px 4px;
        backdrop-filter: blur(8px);
      }
      .cd-num {
        font-family: "Fraunces", serif;
        font-size: clamp(1.4rem, 5.5vw, 1.9rem);
        color: var(--gold); line-height: 1;
      }
      .cd-lbl { font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-dim); margin-top: 6px; }

      .note {
        font-family: "Fraunces", serif; font-style: italic;
        color: var(--cream); font-size: 1rem; line-height: 1.6;
        max-width: 32ch; margin: 0 auto;
      }
      footer {
        margin-top: 24px; color: var(--text-dim); font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <canvas id="snow"></canvas>
    <a href="/fiting.html" class="back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      home
    </a>

    <main class="card">
      <div class="tree">
        <svg viewBox="0 0 140 180" xmlns="http://www.w3.org/2000/svg">
          <polygon class="star" points="70,10 76,26 92,26 79,36 84,52 70,42 56,52 61,36 48,26 64,26" fill="#f4c14b"/>
          <polygon points="70,30 40,80 100,80" fill="#3d8a6a"/>
          <polygon points="70,60 30,120 110,120" fill="#2e6b52"/>
          <polygon points="70,95 20,160 120,160" fill="#3d8a6a"/>
          <rect x="60" y="158" width="20" height="18" fill="#6b3f22"/>
          <circle class="bulb" cx="55" cy="75" r="4" fill="#d3423a"/>
          <circle class="bulb" cx="80" cy="70" r="4" fill="#f4c14b"/>
          <circle class="bulb" cx="45" cy="105" r="4" fill="#7bc9e2"/>
          <circle class="bulb" cx="70" cy="100" r="4" fill="#d3423a"/>
          <circle class="bulb" cx="95" cy="110" r="4" fill="#f4c14b"/>
          <circle class="bulb" cx="35" cy="140" r="4" fill="#7bc9e2"/>
          <circle class="bulb" cx="65" cy="135" r="4" fill="#d3423a"/>
          <circle class="bulb" cx="95" cy="145" r="4" fill="#f4c14b"/>
        </svg>
      </div>

      <div class="eyebrow">a page in progress</div>
      <h1><em>Christmas</em> is coming</h1>
      <p class="lead">I'm still wrapping this one. Come back closer to the day and you'll find your gift here.</p>

      <div class="countdown">
        <div class="cd"><div class="cd-num" id="d">--</div><div class="cd-lbl">days</div></div>
        <div class="cd"><div class="cd-num" id="h">--</div><div class="cd-lbl">hrs</div></div>
        <div class="cd"><div class="cd-num" id="m">--</div><div class="cd-lbl">min</div></div>
        <div class="cd"><div class="cd-num" id="s">--</div><div class="cd-lbl">sec</div></div>
      </div>

      <p class="note">"The best gifts take a little time — like us." ♡</p>
      <footer>meiot.site · check back on Dec 25</footer>
    </main>

    <script type="module">
      // Target: Dec 25 this year, or next year if already past
      function nextTarget() {
        const now = new Date();
        let t = new Date(now.getFullYear(), 11, 25, 0, 0, 0);
        if (t < now) t = new Date(now.getFullYear() + 1, 11, 25);
        return t;
      }
      const target = nextTarget();
      function tick() {
        const diff = target - new Date();
        if (diff <= 0) { ["d","h","m","s"].forEach(id => document.getElementById(id).textContent = 0); return; }
        document.getElementById("d").textContent = Math.floor(diff / 864e5);
        document.getElementById("h").textContent = String(Math.floor(diff / 36e5) % 24).padStart(2,"0");
        document.getElementById("m").textContent = String(Math.floor(diff / 6e4) % 60).padStart(2,"0");
        document.getElementById("s").textContent = String(Math.floor(diff / 1000) % 60).padStart(2,"0");
      }
      tick(); setInterval(tick, 1000);

      // Snow canvas
      const c = document.getElementById("snow"); const ctx = c.getContext("2d");
      let W, H, flakes = [];
      function resize() {
        W = window.innerWidth; H = window.innerHeight;
        c.width = W * devicePixelRatio; c.height = H * devicePixelRatio;
        c.style.width = W + "px"; c.style.height = H + "px";
        ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      }
      resize(); window.addEventListener("resize", () => { resize(); flakes = init(); });
      function init() {
        const n = Math.min(60, Math.floor(W / 12));
        return Array.from({length: n}, () => ({
          x: Math.random() * W, y: Math.random() * H,
          r: Math.random() * 2 + 0.8, vy: 0.3 + Math.random() * 1.2, o: 0.4 + Math.random() * 0.5,
        }));
      }
      flakes = init();
      function frame() {
        ctx.clearRect(0, 0, W, H);
        flakes.forEach(f => {
          ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(255,255,255," + f.o + ")"; ctx.fill();
          f.y += f.vy; f.x += Math.sin(f.y * 0.01) * 0.3;
          if (f.y > H) { f.y = -5; f.x = Math.random() * W; }
        });
        requestAnimationFrame(frame);
      }
      frame();
    </script>
  </body>
</html>
